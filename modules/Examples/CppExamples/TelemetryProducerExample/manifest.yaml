description: >-
  A telemetry publisher whose measurements are declared in this manifest. The OpenTelemetry client
  is generated from that declaration: the module writes no export code, holds no exporter and
  configures no endpoint. It samples a simulator instead of hardware, so it stands in for a driver
  without needing one.
config:
  publish_interval_ms:
    description: How often the simulator samples. The export interval applies on top.
    type: integer
    minimum: 10
    default: 250
  live_only:
    description: Sample the live electrical measurements only, leaving the slow ones alone.
    type: boolean
    default: false
provides:
  main:
    interface: empty
    description: >-
      Nothing. A module has to provide something, and what this one does -- measure -- is declared
      below rather than here, because telemetry is not an interface.
telemetry:
  metrics:
    powermeter.temperature:
      description: Board temperature
      unit: Cel
    powermeter.frequency:
      description: Grid frequency
      unit: Hz
    powermeter.current:
      description: Output current
      unit: A
    powermeter.uptime:
      description: Seconds since the module started
      unit: s
      instrument: counter
      type: int
metadata:
