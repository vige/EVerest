description: >-
  Logs every telemetry update it receives. A debugging sink for the telemetry consumer library: it
  declares no interfaces, and the sets it may consume are wired to it in config.yaml.
config:
  filter_module_id:
    description: Only consume telemetry published by this module id. Empty string means every module.
    type: string
    default: ""
  filter_module_type:
    description: Only consume telemetry published by this module type. Empty string means every type.
    type: string
    default: ""
  filter_set:
    description: Only consume this telemetry set. Empty string means every set.
    type: string
    default: ""
  filter_entries:
    description: >-
      Comma separated entry names to consume. Empty string means every entry the set declares.
    type: string
    default: ""
  print_definitions:
    description: Log the declaration of every set that answered get_definition.
    type: boolean
    default: true
requires:
  telemetry:
    interface: telemetry
    min_connections: 0
    max_connections: 128
metadata:
  license: https://opensource.org/licenses/Apache-2.0
  authors:
    - Kempower
