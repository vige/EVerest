# Which OpenTelemetry metrics this station exposes to the CSMS as device model variables.
#
# Curated on purpose. Anything that can reach the OTLP endpoint may publish a metric; the
# CSMS-facing device model is a contract with the operator and changes only when someone adds a
# line here. A metric nobody names below is decoded, found to match nothing, and dropped.
#
# The characteristics live here rather than with the producer because OTLP has nowhere to put them:
# a metric carries a name, a unit and attributes, and no bounds, no enumeration and no data type.
# That also makes the device model complete at start-up, before any producer has said anything --
# a GetBaseReport at boot lists every variable below, reading as absent until a value arrives.
#
# `attributes` selects among the data points of one metric. Every attribute named must be present
# and equal; anything else on the point is ignored. Values compare as text, so `evse: 1` matches an
# attribute sent as the integer 1.
telemetry_mappings:
  - ocpp:
      component:
        name: PowerMeterDC
        evse: { id: 1 }
      variable:
        name: MeterTemperature
      characteristics: { dataType: decimal, unit: Celsius, min: -40, max: 120 }
    otel:
      metric: powermeter.temperature
      attributes: { evse: 1 }

  - ocpp:
      component:
        name: PowerMeterDC
        evse: { id: 1 }
      variable:
        name: Current
      characteristics: { dataType: decimal, unit: A, min: 0, max: 500 }
    otel:
      metric: powermeter.current
      attributes: { evse: 1 }

  - ocpp:
      component:
        name: PowerMeterDC
        evse: { id: 1 }
      variable:
        name: Frequency
      characteristics: { dataType: decimal, unit: Hz, min: 45, max: 55 }
    otel:
      metric: powermeter.frequency
      attributes: { evse: 1 }

  # The same metric name, a different data point. One selector per EVSE, one variable per EVSE.
  - ocpp:
      component:
        name: PowerMeterDC
        evse: { id: 2 }
      variable:
        name: MeterTemperature
      characteristics: { dataType: decimal, unit: Celsius, min: -40, max: 120 }
    otel:
      metric: powermeter.temperature
      attributes: { evse: 2 }

  # Nothing in EVerest publishes these. They come from whatever on the station is in a position to
  # know -- a shell script, a modem daemon -- and reach the CSMS by being named here and nowhere
  # else. This is the case the telemetry interface could not serve without a module per source.
  - ocpp:
      component:
        name: Controller
      variable:
        name: CPUUtilization
      characteristics: { dataType: decimal, unit: Percent, min: 0, max: 100 }
    otel:
      metric: system.cpu.utilization

  - ocpp:
      component:
        name: Controller
      variable:
        name: MemoryUsed
      characteristics: { dataType: integer, unit: By, min: 0 }
    otel:
      metric: system.memory.usage
      attributes: { state: used }
